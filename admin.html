<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Color Match - Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/views/admin.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cog"></i> Administración de Usuarios</h1>
            <div class="user-info">
                <span id="currentUserDisplay"></span>
                <button id="backBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Volver</button>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>
        </div>

        <div class="admin-section" style="background: transparent; padding: 0; border: none;">
            <div class="catalog-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                <div class="premium-card" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px; overflow: hidden; grid-column: 1 / -1;">
                    <div class="card-header" style="border-bottom: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; background: rgba(59, 130, 246, 0.05);">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="width: 45px; height: 45px; background: rgba(59, 130, 246, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                                <i class="fas fa-users" style="font-size: 1.4rem;"></i>
                            </div>
                            <div>
                                <h3 style="margin: 0; font-size: 1.2rem; color: #fff;">Gestión de Usuarios</h3>
                                <span style="font-size: 0.8rem; color: #3b82f6; font-weight: 600;">SEGURIDAD Y PERMISOS</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button id="migrateMasterBtn" style="display:none; align-items:center; gap:8px; background:linear-gradient(135deg,#7c3aed,#4c1d95); border:none; color:white; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.85rem; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);">
                                <i class="fas fa-layer-group"></i> JERARQUÍA MASTER
                            </button>
                            <button id="addUserBtn" class="premium-btn" style="background: #3b82f6; color: white; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-plus"></i> CREAR USUARIO
                            </button>
                        </div>
                    </div>
                    <div class="card-body" style="padding: 1.5rem;">
                        <div id="adminExportTools" style="display:flex; gap:12px; margin-bottom: 1.5rem; background:rgba(30,41,59,0.5); padding:1rem; border-radius:12px; border:1px solid rgba(255,255,255,0.05); align-items:center;">
                            <div style="color:#94a3b8; font-size:0.8rem; font-weight:900;">
                                <i class="fas fa-database" style="margin-right:8px; color:#3b82f6;"></i> RESPALDO JSON:
                            </div>
                            <button class="btn-secondary" onclick="window.downloadTable('usuarios')" style="background:rgba(255,255,255,0.05); border:1px solid #475569; color:#94a3b8; font-size:0.75rem; padding:6px 12px; border-radius:6px; cursor:pointer;">
                                <i class="fas fa-download"></i> USUARIOS
                            </button>
                        </div>
                        <div class="admin-table-wrapper" style="background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                                <thead style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">
                                    <tr>
                                        <th style="padding: 15px; text-align: left;">Usuario</th>
                                        <th style="padding: 15px; text-align: left;">Contraseña</th>
                                        <th style="padding: 15px; text-align: left;">Permisos</th>
                                        <th style="padding: 15px; text-align: center;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="adminTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Auth, ALL_PERMISSIONS } from './js/core/auth.js';

        const auth = new Auth();

        if (!auth.loadSession()) {
            window.location.href = 'login.html';
        }

        const currentUser = auth.getCurrentUser();
        
        if (!currentUser.isMaster && !currentUser.permissions?.includes('admin')) {
            alert('⚠️ No tienes permisos de administrador');
            window.location.href = 'index.html';
        }

        const displaySpan = document.getElementById('currentUserDisplay');
        if (displaySpan) {
            displaySpan.textContent = `👤 ${currentUser.username}${currentUser.isMaster ? ' (MASTER)' : ''}`;
        }

        async function renderUsers() {
            const tableBody = document.getElementById('adminTableBody');
            const users = await auth.getAllUsers();
            
            if (users.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="empty-state">No hay usuarios registrados<\/td><\/tr>';
                return;
            }
            
            tableBody.innerHTML = users.map(user => {
                const isCurrentUser = user.id === currentUser.id;
                const permissionBadges = renderPermissionBadges(user);
                     return `
                    <tr data-id="${user.id}">
                        <td><strong>${escapeHtml(user.username)}</strong>${user.is_master ? ' <span class="permission-badge master">👑 MASTER</span>' : ''}${isCurrentUser ? ' <span class="permission-badge allowed">(tú)</span>' : ''}</td>
                        <td><input type="password" class="password-placeholder" value="********" disabled style="background:transparent; border:none; color:#9ca3af; width:100px;"><button class="admin-btn show-password" data-username="${escapeHtml(user.username)}" data-password="${user.password || ''}" style="font-size:0.7rem;"><i class="fas fa-eye"></i></button></td>
                        <td class="user-permissions">${permissionBadges}</td>
                        <td class="admin-actions-cell">
                            <button class="admin-btn edit-user" data-id="${user.id}" data-username="${escapeHtml(user.username)}" data-permissions='${JSON.stringify(user.permisos || [])}' data-ismaster="${user.is_master}" data-password="${user.password || ''}"><i class="fas fa-edit"></i></button>
                            ${!user.is_master ? `<button class="admin-btn delete delete-user" data-id="${user.id}" data-username="${escapeHtml(user.username)}"><i class="fas fa-trash"></i></button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
            
            document.querySelectorAll('.edit-user').forEach(btn => {
                btn.onclick = () => showUserModal({
                    id: parseInt(btn.dataset.id),
                    username: btn.dataset.username,
                    permissions: JSON.parse(btn.dataset.permissions),
                    isMaster: btn.dataset.ismaster === 'true',
                    password: btn.dataset.password
                });
            });
            
            document.querySelectorAll('.delete-user').forEach(btn => {
                btn.onclick = () => deleteUser(parseInt(btn.dataset.id), btn.dataset.username);
            });
            
            document.querySelectorAll('.show-password').forEach(btn => {
                btn.onclick = () => {
                    const username = btn.dataset.username;
                    const password = btn.dataset.password;
                    if (password) {
                        alert(`🔐 Contraseña de "${username}": ${password}`);
                    } else {
                        alert('❌ No se pudo obtener la contraseña');
                    }
                };
            });
        }
        
        function renderPermissionBadges(user) {
            if (user.is_master) {
                return '<span class="permission-badge master" style="background:linear-gradient(135deg,#f59e0b,#d97706); color:white; padding:4px 10px; border-radius:6px; font-size:0.7rem; font-weight:bold;"><i class="fas fa-star"></i> ACCESO TOTAL</span>';
            }
            
            const permissionNames = {
                comparator: 'Comparar',
                history: 'Bandeja',
                paletteValidator: 'Validar Paleta',
                development: 'Desarrollo',
                assignment: 'Asignación',
                reports: 'Reportes',
                admin: 'Admin',
                editCatalog: 'Editar Catálogo',
                dashboard: 'Dashboard',
                backup: 'Backup',
                linearization: 'Linealización'
            };
            
            const badges = (user.permisos || [])
                .filter(p => permissionNames[p])
                .map(perm => `<span class="permission-badge" style="background:rgba(59,130,246,0.15); color:#3b82f6; border:1px solid rgba(59,130,246,0.3); padding:3px 8px; border-radius:5px; font-size:0.65rem; font-weight:600; margin-right:4px; margin-bottom:4px; display:inline-block;">${permissionNames[perm]}</span>`);
            
            return badges.length > 0 ? badges.join('') : '<span style="color:#64748b; font-size:0.75rem; font-style:italic;">Sin permisos</span>';
        }
        
        function showUserModal(userToEdit = null) {
            const isEditing = !!userToEdit;
            // Quitamos la restricción isEditingMaster para que el MASTER pueda editar todo
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content" style="background:#0f172a; border:2px solid ${userToEdit?.isMaster ? '#f59e0b' : '#3b82f6'}; border-radius:20px; padding:0; width:95%; max-width:550px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">
                    <div class="modal-header" style="background: ${userToEdit?.isMaster ? 'linear-gradient(135deg,#f59e0b,#d97706)' : 'linear-gradient(135deg,#3b82f6,#1d4ed8)'}; padding:1.5rem; display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="color: white; margin:0; font-size:1.3rem; display:flex; align-items:center; gap:10px;">
                            ${isEditing ? (userToEdit?.isMaster ? '<i class="fas fa-crown"></i> Perfil MASTER' : '<i class="fas fa-user-edit"></i> Editar Usuario') : '<i class="fas fa-user-plus"></i> Nuevo Usuario'}
                        </h3>
                        <button class="modal-close" style="background:transparent; border:none; color: white; font-size:1.5rem; cursor:pointer;">&times;</button>
                    </div>
                    
                    <div class="modal-body" style="padding:2rem;">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
                            <div class="form-group">
                                <label style="display:block; color:#94a3b8; font-size:0.75rem; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">Nombre de Usuario</label>
                                <input type="text" id="modalUsername" value="${userToEdit ? escapeHtml(userToEdit.username) : ''}" ${isEditing ? 'disabled' : ''} 
                                       style="width:100%; background:#1e293b; border:1px solid #334155; color:white; padding:12px; border-radius:10px; font-weight:bold; box-sizing:border-box; ${isEditing ? 'opacity:0.6;' : ''}">
                            </div>
                            
                            <div class="form-group">
                                <label style="display:block; color:#94a3b8; font-size:0.75rem; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">Contraseña</label>
                                <div style="position:relative;">
                                    <input type="password" id="modalPassword" value="${userToEdit?.password || ''}" placeholder="${isEditing ? 'En blanco = mantener' : ''}"
                                           style="width:100%; background:#1e293b; border:1px solid #334155; color:white; padding:12px; padding-right:45px; border-radius:10px; box-sizing:border-box;">
                                    <i class="fas fa-eye-slash toggle-password" style="position:absolute; right:15px; top:14px; color:#64748b; cursor:pointer; font-size:1.1rem;"></i>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top:2rem;">
                            <h4 style="color:#3b82f6; font-size:0.85rem; font-weight:900; margin-bottom:1rem; display:flex; align-items:center; gap:8px;">
                                <i class="fas fa-key"></i> PERMISOS DE ACCESO AL SISTEMA
                            </h4>
                            <div class="permissions-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; background:rgba(30,41,59,0.5); padding:1.5rem; border-radius:15px; border:1px solid rgba(255,255,255,0.05);">
                                ${[
                                    {v:'comparator', l:'Comparar Archivos'},
                                    {v:'history', l:'Bandeja de Entrada'},
                                    {v:'paletteValidator', l:'Validar Paletas'},
                                    {v:'development', l:'Sección Desarrollo'},
                                    {v:'assignment', l:'Asignación Órdenes'},
                                    {v:'reports', l:'Reportes de Prod.'},
                                    {v:'dashboard', l:'Dashboard General'},
                                    {v:'backup', l:'Gestión de Backups'},
                                    {v:'admin', l:'Panel Administrador'},
                                    {v:'editCatalog', l:'Editar Catálogos'},
                                    {v:'linearization', l:'Linealización'}
                                ].map(p => `
                                    <label style="display:flex; align-items:center; gap:10px; color:#e2e8f0; font-size:0.85rem; cursor:pointer; padding:5px; border-radius:5px; transition:all 0.2s;">
                                        <input type="checkbox" value="${p.v}" ${userToEdit?.permissions?.includes(p.v) ? 'checked' : ''} 
                                               style="width:18px; height:18px; accent-color:#3b82f6; cursor:pointer;">
                                        ${p.l}
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer" style="padding:1.5rem 2rem; background:rgba(30,41,59,0.3); display:flex; gap:1rem; justify-content:flex-end; border-top:1px solid rgba(255,255,255,0.05);">
                        <button class="btn-secondary cancel-modal" style="background:transparent; border:1px solid #475569; color:#94a3b8; padding:10px 25px; border-radius:10px; cursor:pointer; font-weight:bold;">Cancelar</button>
                        <button class="btn-primary confirm-modal" style="background:${userToEdit?.isMaster ? 'linear-gradient(135deg,#f59e0b,#d97706)' : 'linear-gradient(135deg,#3b82f6,#1d4ed8)'}; border:none; padding:10px 30px; border-radius:10px; cursor:pointer; color:white; font-weight:bold; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);">${isEditing ? 'Guardar Cambios' : 'Crear Usuario'}</button>
                    </div>
                </div>
            `;            
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('active'), 10);
            
            const closeModal = () => {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300);
            };
            
            const togglePassword = modal.querySelector('.toggle-password');
            const passwordInput = modal.querySelector('#modalPassword');
            if (togglePassword) {
                togglePassword.onclick = () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePassword.classList.toggle('fa-eye');
                    togglePassword.classList.toggle('fa-eye-slash');
                };
            }
            
            modal.querySelector('.modal-close').onclick = closeModal;
            modal.querySelector('.cancel-modal').onclick = closeModal;
            
            modal.querySelector('.confirm-modal').onclick = async () => {
                const username = modal.querySelector('#modalUsername').value.trim();
                let password = modal.querySelector('#modalPassword').value;
                let permissions = [];
                let isMaster = userToEdit ? userToEdit.isMaster : false;
                
                const checkboxes = modal.querySelectorAll('.permissions-grid input:checked');
                permissions = Array.from(checkboxes).map(cb => cb.value);
                
                if (!username) {
                    alert('⚠️ Debe ingresar un nombre de usuario.');
                    return;
                }
                
                if (!isEditing && !password) {
                    alert('⚠️ Debe ingresar una contraseña.');
                    return;
                }
                
                if (!isEditing && password.length < 6) {
                    alert('⚠️ La contraseña debe tener al menos 6 caracteres.');
                    return;
                }
                
                if (isEditing && password === '********') {
                    password = null;
                }
                
                const confirmBtn = modal.querySelector('.confirm-modal');
                const originalText = confirmBtn.innerHTML;
                confirmBtn.innerHTML = '⏳ Procesando...';
                confirmBtn.disabled = true;
                
                try {
                    if (isEditing && userToEdit) {
                        const updates = {};
                        if (password) updates.password = password;
                        updates.permissions = permissions;
                        updates.isMaster = isMaster;
                        
                        const result = await auth.updateUser(userToEdit.id, updates);
                        if (result.success) {
                            alert(`✅ Usuario "${username}" actualizado correctamente.`);
                            closeModal();
                            await renderUsers();
                            if (currentUser.id === userToEdit.id && password) {
                                alert('⚠️ Tu contraseña ha sido cambiada. Por favor inicia sesión nuevamente.');
                                auth.logout();
                            }
                        } else {
                            alert(`❌ Error: ${result.error}`);
                        }
                    } else {
                        const result = await auth.createUser(username, password, permissions, isMaster);
                        if (result.success) {
                            alert(`✅ Usuario "${username}" creado correctamente.\n🔑 Contraseña: ${password}`);
                            closeModal();
                            await renderUsers();
                        } else {
                            alert(`❌ Error: ${result.error}`);
                        }
                    }
                } catch (error) {
                    alert(`❌ Error inesperado: ${error.message}`);
                } finally {
                    confirmBtn.innerHTML = originalText;
                    confirmBtn.disabled = false;
                }
            };
            
            modal.onclick = (e) => { if (e.target === modal) closeModal(); };
        }
        
        async function deleteUser(id, username) {
            if (!confirm(`¿Estás seguro de que quieres eliminar al usuario "${username}"?`)) return;
            
            try {
                const result = await auth.deleteUser(id);
                if (result.success) {
                    alert(`✅ Usuario "${username}" eliminado.`);
                    await renderUsers();
                } else {
                    alert(`❌ Error: ${result.error}`);
                }
            } catch (error) {
                alert(`❌ Error inesperado: ${error.message}`);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        document.getElementById('addUserBtn').onclick = () => showUserModal();
        document.getElementById('backBtn').onclick = () => window.location.href = 'index.html';
        document.getElementById('logoutBtn').onclick = () => {
            auth.logout();
            window.location.href = 'login.html';
        };

        // FUNCIÓN GLOBAL DE DESCARGA
        window.downloadTable = async (tableName) => {
            const { supabase } = await import('./js/core/supabaseClient.js');
            try {
                const { data, error } = await supabase.from(tableName).select('*');
                if (error) throw error;
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_${tableName}_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert(`✅ Tabla "${tableName}" descargada correctamente.`);
            } catch (err) {
                alert('❌ Error al descargar: ' + err.message);
            }
        };

        // Botón de migración MASTER → COMPLETO (solo visible para el MASTER real)
        const migrateBtn = document.getElementById('migrateMasterBtn');
        if (currentUser.isMaster) {
            migrateBtn.style.display = 'inline-flex';
            migrateBtn.onclick = async () => {
                const { supabase } = await import('./js/core/supabaseClient.js');
                const users = await auth.getAllUsers();
                const otherMasters = users.filter(u => u.is_master && u.id !== currentUser.id);

                if (otherMasters.length === 0) {
                    alert('ℹ️ No hay otros usuarios MASTER que convertir. La jerarquía ya está correcta.');
                    return;
                }

                const names = otherMasters.map(u => u.username).join('\n  • ');
                if (!confirm(`⚠️ ESTABLECER JERARQUÍA\n\nEstos usuarios cambiarán de MASTER → COMPLETO:\n  • ${names}\n\nMantendrán acceso a todas las secciones, pero SOLO TÚ (MASTER) podrás editarlos.\n\n¿Continuar?`)) return;

                migrateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
                migrateBtn.disabled = true;

                let ok = 0, fail = 0;
                for (const user of otherMasters) {
                    const { error } = await supabase
                        .from('usuarios')
                        .update({ is_master: false, permisos: ALL_PERMISSIONS })
                        .eq('id', user.id);
                    if (error) { console.error('Error:', user.username, error); fail++; }
                    else ok++;
                }

                migrateBtn.innerHTML = '<i class="fas fa-layer-group"></i> Establecer Jerarquía MASTER/COMPLETO';
                migrateBtn.disabled = false;

                if (ok > 0) {
                    alert(`✅ ${ok} usuario(s) convertidos a COMPLETO correctamente.${fail > 0 ? `\n⚠️ ${fail} fallaron, revisa la consola.` : ''}`);
                    await renderUsers();
                } else {
                    alert('❌ No se completó la migración. Revisa la consola.');
                }
            };
        }
        
        renderUsers();
    </script>
</body>
</html>
